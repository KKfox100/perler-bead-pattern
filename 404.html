<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6E8AA3">
<!-- 404 页不该被收录 -->
<meta name="robots" content="noindex,follow">
<title>页面不存在 · 拼豆图案生成器</title>
<style>
  :root{
    --bg:#F2EFEB; --card:#FFFFFF; --ink:#3B3A37; --ink-2:#5E5C57; --ink-3:#918D86;
    --line:#E4DFD8; --primary:#5A7590; --primary-dark:#4A6278;
    --clay:#A98074;
    --hero:linear-gradient(112deg,#6E8AA3 0%,#7D93A2 34%,#928A7E 68%,#A08C7C 100%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
                "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .card{
    width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:36px 32px;text-align:center;
    box-shadow:0 1px 2px rgba(59,58,55,.04), 0 6px 24px rgba(59,58,55,.07);
  }
  .num{
    font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px;
    background:var(--hero);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  h1{margin:18px 0 10px;font-size:19px;font-weight:700;}
  p{margin:0 0 24px;font-size:13.5px;line-height:1.75;color:var(--ink-3);}
  a{
    display:inline-block;padding:10px 22px;border-radius:10px;text-decoration:none;
    background:var(--primary);color:#fff;font-size:14px;font-weight:600;
    transition:background .15s;
  }
  a:hover{background:var(--primary-dark);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
       background:var(--clay);margin-right:7px;vertical-align:1px;}
</style>
</head>
<body>
  <div class="card">
    <div class="num">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能输错了，或者页面已经搬走。<br>
       <span class="dot"></span>拼豆图案生成器是单页应用，从首页进就行。</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
